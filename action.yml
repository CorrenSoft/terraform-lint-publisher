name: Terraform Lint Publisher
description: Run TFLint with opinionated defaults and publish results to GitHub (summary, PR comment, check run).
author: CorrenSoft
branding:
  icon: check-circle
  color: blue

inputs:
  working-directory:
    description: Directory to run TFLint in
    required: true
  recursive:
    description: Run TFLint recursively
    required: false
    default: true
  minimum-severity:
    description: Minimum severity considered a failure (warning|error)
    required: false
    default: error
  fail-on-issues:
    description: Fail the job if lint state is failure
    required: false
    default: true
  fail-on-publish:
    description: Fail the job if publishing fails
    required: false
    default: false
  publish-summary:
    description: When to publish Job Summary (always|never|on-findings)
    required: false
    default: on-findings
  publish-pr:
    description: When to publish PR comment (always|never|on-findings)
    required: false
    default: never
  publish-check-run:
    description: When to publish Check Run (always|never|on-findings)
    required: false
    default: never

outputs:
  state:
    description: Final logical state (success|failure)
  total:
    description: Total issues found
  errors:
    description: Error count
  warnings:
    description: Warning count

runs:
  using: composite
  steps:
    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v4

    - name: Run TFLint and build report
      id: execute
      shell: pwsh
      run: |
        & "$env:GITHUB_ACTION_PATH/src/execute.ps1" `
          -MinimumSeverity "${{ inputs.minimum-severity }}" `
          -Recursive "${{ inputs.recursive }}" `
          -ReportCheckRun "${{ inputs.publish-check-run }}" `
          -ReportPullRequest "${{ inputs.publish-pr }}" `
          -ReportSummary "${{ inputs.publish-summary }}" `
          -WorkingDirectory "$HOME/${{ inputs.working-directory }}" `

    - name: Publish Check Run
      uses: CorrenSoft/github-content-publisher@v0.1.0
      if: steps.execute.outputs.checkMessage != ''
      with:
        channel: summary
        body: steps.execute.outputs.checkMessage
        mode: replace
        fail-on-error: ${{ inputs.fail-on-fail-on-publish }}

    - name: Publish Pull Request
      uses: CorrenSoft/github-content-publisher@v0.1.0
      if: steps.execute.outputs.pr-message != '' && github.event-name == 'pull_request'
      with:
        body: steps.execute.outputs.pr-message
        channel: pull-request
        fail-on-error: ${{ inputs.fail-on-fail-on-publish }}
        mode: replace

    - name: Publish Summary
      uses: CorrenSoft/github-content-publisher@v0.1.0
      if: steps.execute.outputs.summaryMessage != ''
      with:
        body: steps.execute.outputs.summaryMessage
        channel: summary
        fail-on-error: ${{ inputs.fail-on-fail-on-publish }}
        mode: replace

    - name: Finalize
      shell: pwsh
      run: |
        if (steps.execute.outputs.failureMessage) {
          WriteError steps.execute.outputs.failureMessage
        }
        if ('${{ inputs.fail-on-issues }}' -eq 'true' -and '${{ steps.execute.outputs.state }}' -eq 'failure') {
          WriteError "Lint errors found."
        }
