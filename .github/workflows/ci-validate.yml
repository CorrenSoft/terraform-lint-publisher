
name: CI Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: |
          set -euo pipefail
          LATEST=$(curl -s https://api.github.com/repos/rhysd/actionlint/releases/latest | jq -r .tag_name)
          curl -sL https://github.com/rhysd/actionlint/releases/download/${LATEST}/actionlint_${LATEST#v}_linux_amd64.tar.gz             | tar -xz -C /usr/local/bin actionlint
      - name: Run actionlint
        run: actionlint -color

  ps-lint:
    name: PSScriptAnalyzer (PowerShell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          }
          Invoke-ScriptAnalyzer -Path ./src -Recurse -Severity Error -EnableExit

  shellcheck:
    name: ShellCheck (optional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
      - name: Run ShellCheck if any .sh files
        run: |
          set -euo pipefail
          files=$(git ls-files '*.sh' || true)
          if [ -n "${files}" ]; then
            shellcheck ${files}
          else
            echo "No .sh files found, skipping."
          fi
